name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify tag belongs to main and versions align
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          version=$(./scripts/verify-release "${GITHUB_REF_NAME}")
          echo "RELEASE_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "RELEASE_EPOCH=$(git show -s --format=%ct "${GITHUB_SHA}")" \
            >> "${GITHUB_ENV}"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      - name: Run Python and architecture tests
        run: |
          ./scripts/test
          ./scripts/acceptance
      - name: Verify Web adapters and public demo
        run: |
          ./scripts/test-web
          ./scripts/build-demo "${RUNNER_TEMP}/personal-knowledge-os-demo"
      - name: Build and verify Java service
        working-directory: apps/api
        run: |
          ./mvnw --batch-mode \
            -Dproject.build.outputTimestamp="${RELEASE_EPOCH}" verify
      - name: Prove Java artifact is reproducible
        working-directory: apps/api
        run: |
          jar_path=$(find target -maxdepth 1 -type f \
            -name 'personal-knowledge-service-*.jar' \
            ! -name '*.jar.original')
          test -n "${jar_path}"
          test "$(printf '%s\n' "${jar_path}" | wc -l | tr -d ' ')" = "1"
          first_hash=$(sha256sum "${jar_path}" | cut -d ' ' -f 1)
          ./mvnw --batch-mode -DskipTests \
            -Dproject.build.outputTimestamp="${RELEASE_EPOCH}" clean package
          jar_path=$(find target -maxdepth 1 -type f \
            -name 'personal-knowledge-service-*.jar' \
            ! -name '*.jar.original')
          second_hash=$(sha256sum "${jar_path}" | cut -d ' ' -f 1)
          test "${first_hash}" = "${second_hash}"
      - name: Verify container image builds
        run: docker build --tag personal-knowledge-os-api:release --file apps/api/Dockerfile .
      - name: Stage versioned release artifacts
        run: |
          mkdir -p release
          jar_path=$(find apps/api/target -maxdepth 1 -type f \
            -name 'personal-knowledge-service-*.jar' \
            ! -name '*.jar.original')
          test -n "${jar_path}"
          test "$(printf '%s\n' "${jar_path}" | wc -l | tr -d ' ')" = "1"
          artifact="personal-knowledge-service-${RELEASE_VERSION}.jar"
          install -m 0644 "${jar_path}" "release/${artifact}"
          cd release
          sha256sum "${artifact}" > "${artifact}.sha256"
      - name: Stage complete local product with checksum
        run: ./scripts/package-local --output release
      - name: Upload verified artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.ref_name }}
          path: release/
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: release/*
      - name: Create or repair GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release/* \
              --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi

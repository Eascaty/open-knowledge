services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: personal-knowledge-os-api:0.5.0
    user: "10001:10001"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /sqlite-native:size=16m,uid=10001,gid=10001,mode=0700,exec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: ${API_MEMORY_LIMIT:-512m}
    cpus: ${API_CPU_LIMIT:-1.0}
    stop_grace_period: 20s
    environment:
      SERVER_ADDRESS: 0.0.0.0
      PORT: 8080
      KNOWLEDGE_DB_PATH: /data/knowledge.sqlite3
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=75.0
        -Djava.io.tmpdir=/tmp
        -Dorg.sqlite.tmpdir=/sqlite-native
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${KNOWLEDGE_DB_FILE:?Set KNOWLEDGE_DB_FILE to a verified SQLite snapshot}
        target: /data/knowledge.sqlite3
        read_only: true
    restart: unless-stopped
    networks:
      - api-local

networks:
  api-local:
    internal: true

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "local-knowledge-os"
version = "0.5.0"
description = "Local-first, zero-paid-API personal knowledge pipeline"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Eascaty" }]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Topic :: Text Processing :: Indexing",
]

[project.urls]
Homepage = "https://github.com/Eascaty/open-knowledge"
Repository = "https://github.com/Eascaty/open-knowledge"
Issues = "https://github.com/Eascaty/open-knowledge/issues"

[project.scripts]
knowledge-os = "knowledge_os.cli:main"
knowledge-os-site = "knowledge_os.site.__main__:main"
knowledge-os-ops = "knowledge_os.operations.__main__:main"

[tool.setuptools]
package-dir = { "" = "apps/pipeline/src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["apps/pipeline/src"]

[tool.setuptools.package-data]
knowledge_os = ["default_taxonomy.json"]

[tool.unittest]
start-directory = "tests"
